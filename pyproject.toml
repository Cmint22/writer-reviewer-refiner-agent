[project]
name = "writer-reviewer-refiner-agent"
version = "0.1.0"
description = "Minimal multi-agent (Writer -> Reviewer -> Refiner) pipeline for a short tutorial, single review round, FastAPI + OpenAI-compatible LLM."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.1",
    "openai>=1.30.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "httpx>=0.27.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
